services:
  db:
    ports: !reset []

  api:
    ports: !reset []

  web:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      RELAY_API_URL: http://api:8080
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
