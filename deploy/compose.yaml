name: renal-relay

services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: renalrelay
      POSTGRES_USER: renalrelay_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - postgres_admin_password
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  roles:
    image: postgres:18.6-alpine
    entrypoint: ["sh", "/bootstrap/001-create-roles.sh"]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      PGHOST: db
      PGPORT: "5432"
      POSTGRES_DB: renalrelay
      POSTGRES_USER: renalrelay_admin
    volumes:
      - ../db/init/001-create-roles.sh:/bootstrap/001-create-roles.sh:ro
    secrets:
      - postgres_admin_password
      - app_db_password
      - migrator_db_password
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  migrate:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["migrate"]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: renalrelay
      DATABASE_USER: renalrelay_migrator
      DATABASE_PASSWORD_FILE: /run/secrets/migrator_db_password
      DATABASE_SSLMODE: disable
    secrets:
      - migrator_db_password
    depends_on:
      roles:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["serve"]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: :8080
      SARVAM_API_BASE_URL: ${SARVAM_API_BASE_URL:-https://apps.sarvam.ai}
      SARVAM_ORG_ID: ${SARVAM_ORG_ID:-}
      SARVAM_WORKSPACE_ID: ${SARVAM_WORKSPACE_ID:-}
      SARVAM_APP_ID: ${SARVAM_APP_ID:-}
      SARVAM_APP_VERSION: ${SARVAM_APP_VERSION:-}
      SARVAM_CONNECTION_ID: ${SARVAM_CONNECTION_ID:-}
      SARVAM_AGENT_PHONE_NUMBER: ${SARVAM_AGENT_PHONE_NUMBER:-}
      SARVAM_API_KEY_FILE: /run/secrets/sarvam_api_key
      SARVAM_WEBHOOK_URL: ${SARVAM_WEBHOOK_URL:-}
      SARVAM_WEBHOOK_ENABLED: ${SARVAM_WEBHOOK_ENABLED:-false}
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: renalrelay
      DATABASE_USER: renalrelay_app
      DATABASE_PASSWORD_FILE: /run/secrets/app_db_password
      DATABASE_SSLMODE: disable
    secrets:
      - app_db_password
      - sarvam_api_key
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/renal-relay", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped

  seed:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["seed"]
    profiles: ["dev-seed"]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: renalrelay
      DATABASE_USER: renalrelay_app
      DATABASE_PASSWORD_FILE: /run/secrets/app_db_password
      DATABASE_SSLMODE: disable
      DEMO_CLINICIAN_PASSWORD_FILE: /run/secrets/demo_clinician_password
      DEMO_COORDINATOR_PASSWORD_FILE: /run/secrets/demo_coordinator_password
    secrets:
      - app_db_password
      - demo_clinician_password
      - demo_coordinator_password
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

secrets:
  sarvam_api_key:
    file: ../secrets/sarvam_api_key
  demo_clinician_password:
    file: ../secrets/demo_clinician_password
  demo_coordinator_password:
    file: ../secrets/demo_coordinator_password
  postgres_admin_password:
    file: ../secrets/postgres_admin_password
  app_db_password:
    file: ../secrets/app_db_password
  migrator_db_password:
    file: ../secrets/migrator_db_password

volumes:
  postgres_data:
