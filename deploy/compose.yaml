name: renal-relay

services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: renalrelay
      POSTGRES_USER: renalrelay_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - postgres_admin_password
      - app_db_password
      - migrator_db_password
    volumes:
      - postgres_data:/var/lib/postgresql
      - ../db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["migrate"]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: renalrelay
      DATABASE_USER: renalrelay_migrator
      DATABASE_PASSWORD_FILE: /run/secrets/migrator_db_password
      DATABASE_SSLMODE: disable
    secrets:
      - migrator_db_password
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["serve"]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: :8080
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: renalrelay
      DATABASE_USER: renalrelay_app
      DATABASE_PASSWORD_FILE: /run/secrets/app_db_password
      DATABASE_SSLMODE: disable
    secrets:
      - app_db_password
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/renal-relay", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped

  seed:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["seed"]
    profiles: ["dev-seed"]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: renalrelay
      DATABASE_USER: renalrelay_app
      DATABASE_PASSWORD_FILE: /run/secrets/app_db_password
      DATABASE_SSLMODE: disable
    secrets:
      - app_db_password
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

secrets:
  postgres_admin_password:
    file: ../secrets/postgres_admin_password
  app_db_password:
    file: ../secrets/app_db_password
  migrator_db_password:
    file: ../secrets/migrator_db_password

volumes:
  postgres_data:
